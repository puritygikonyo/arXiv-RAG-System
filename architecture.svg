<circle cx="345" cy="497" r="16" fill="#1C9770"/>
<text class="badge-text" x="345" y="502" text-anchor="middle">Gq</text>
<text class="th" x="345" y="521" text-anchor="middle">Groq LLM</text>
<text class="ts" x="345" y="536" text-anchor="middle">Llama 3.3 70B</text>

<rect x="450" y="472" width="180" height="70" rx="12" fill="#ffffff" stroke="#4FB392" stroke-width="1"/>
<circle cx="540" cy="497" r="16" fill="#1C9770"/>
<text class="badge-text" x="540" y="502" text-anchor="middle">Up</text>
<text class="th" x="540" y="521" text-anchor="middle">Upstash + Langfuse</text>
<text class="ts" x="540" y="536" text-anchor="middle">Semantic cache + tracing</text>

<text class="ts" x="340" y="576" text-anchor="middle" fill="#0a5c42">guardrail → retriever → grader → rewriter → generator, with bounded retries</text>

