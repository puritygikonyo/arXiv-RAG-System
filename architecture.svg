<circle cx="100" cy="183" r="16" fill="#E8973F"/>
<text class="badge-text" x="100" y="188" text-anchor="middle">Ax</text>
<text class="th" x="126" y="176">arXiv API</text>
<text class="ts" x="126" y="194">Recent papers via feedparser</text>

<rect x="355" y="150" width="255" height="66" rx="12" fill="#ffffff" stroke="#E8B95C" stroke-width="1"/>
<circle cx="385" cy="183" r="16" fill="#E8973F"/>
<text class="badge-text" x="385" y="188" text-anchor="middle">Jn</text>
<text class="th" x="411" y="176">Jina embeddings</text>
<text class="ts" x="411" y="194">ingest_arxiv.py chunks + embeds</text>

