<rect x="40" y="652" width="600" height="220" rx="18" fill="#FBEBE4" stroke="#DB8B65" stroke-width="1"/>
<rect x="40" y="652" width="600" height="8" rx="4" fill="#D06A38"/>
<text class="layer-label" x="62" y="678" fill="#7a3814">ACCESS &amp; CLIENTS</text>
<text class="ts" x="62" y="694" fill="#7a3814">Invite-gated — controlled access, no open sharing</text>

<rect x="60" y="714" width="180" height="70" rx="12" fill="#ffffff" stroke="#DB8B65" stroke-width="1"/>
<circle cx="150" cy="739" r="16" fill="#D06A38"/>
