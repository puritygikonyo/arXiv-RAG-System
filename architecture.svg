<circle cx="345" cy="739" r="16" fill="#D06A38"/>
<text class="badge-text" x="345" y="744" text-anchor="middle">Gr</text>
<text class="th" x="345" y="763" text-anchor="middle">Gradio web UI</text>
<text class="ts" x="345" y="778" text-anchor="middle">Shareable login link</text>

<rect x="450" y="714" width="180" height="70" rx="12" fill="#ffffff" stroke="#DB8B65" stroke-width="1"/>
<circle cx="540" cy="739" r="16" fill="#D06A38"/>
<text class="badge-text" x="540" y="744" text-anchor="middle">Tg</text>
<text class="th" x="540" y="763" text-anchor="middle">Telegram bot</text>
<text class="ts" x="540" y="778" text-anchor="middle">/register + questions</text>

<text class="ts" x="340" y="818" text-anchor="middle" fill="#7a3814">Same invites table enforces access across every channel</text>

<text class="legend" x="340" y="866" text-anchor="middle">FastAPI · LangGraph · OpenSearch · Postgres · Groq · Upstash · Langfuse · Gradio · Telegram</text>
