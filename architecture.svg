<rect x="40" y="258" width="600" height="130" rx="18" fill="#E9F1FB" stroke="#6FA3DD" stroke-width="1"/>
<rect x="40" y="258" width="600" height="8" rx="4" fill="#3B7DC4"/>
<text class="layer-label" x="62" y="284" fill="#144a80">STORAGE</text>

<rect x="70" y="304" width="255" height="66" rx="12" fill="#ffffff" stroke="#6FA3DD" stroke-width="1"/>
<circle cx="100" cy="337" r="16" fill="#3B7DC4"/>
<text class="badge-text" x="100" y="342" text-anchor="middle">Pg</text>
<text class="th" x="126" y="330">Postgres · Neon</text>
<text class="ts" x="126" y="348">Papers, chunks, invites, logs</text>

<rect x="355" y="304" width="255" height="66" rx="12" fill="#ffffff" stroke="#6FA3DD" stroke-width="1"/>
<circle cx="385" cy="337" r="16" fill="#3B7DC4"/>
<text class="badge-text" x="385" y="342" text-anchor="middle">Os</text>
<text class="th" x="411" y="330">OpenSearch · Aiven</text>
<text class="ts" x="411" y="348">Hybrid BM25 + vector search</text>

<line x1="340" y1="388" x2="340" y2="410" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="410" width="600" height="220" rx="18" fill="#E5F5F0" stroke="#4FB392" stroke-width="1"/>
<rect x="40" y="410" width="600" height="8" rx="4" fill="#1C9770"/>
<text class="layer-label" x="62" y="436" fill="#0a5c42">FASTAPI BACKEND — AGENTIC RAG CORE</text>
<text class="ts" x="62" y="452" fill="#0a5c42">/api/v1/ask · /search · /admin — one backend, no logic duplicated</text>

<rect x="60" y="472" width="180" height="70" rx="12" fill="#ffffff" stroke="#4FB392" stroke-width="1"/>
<circle cx="150" cy="497" r="16" fill="#1C9770"/>
