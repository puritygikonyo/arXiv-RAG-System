<svg width="680" height="900" viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>arXiv RAG System architecture</title>
<style>
  text { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; }
  .title { font-size: 20px; font-weight: 700; fill: #2C2C2A; }
  .layer-label { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
  .th { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
  .ts { font-size: 11.5px; fill: #55534c; }
  .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  .arr { stroke: #b0aea4; stroke-width: 1.75; stroke-dasharray: 5 4; fill: none; }
  .legend { font-size: 11px; fill: #77756c; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#b0aea4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="900" fill="#FAF9F5"/>
<text class="title" x="40" y="42" text-anchor="start">arXiv RAG System — architecture</text>
<text class="legend" x="40" y="62">Agentic RAG pipeline · deployed as 3 Render services from one Dockerfile</text>

<rect x="40" y="86" width="600" height="150" rx="18" fill="#FDF3E3" stroke="#E8B95C" stroke-width="1"/>
<rect x="40" y="86" width="600" height="8" rx="4" fill="#E8973F"/>
<text class="layer-label" x="62" y="112" fill="#8a5a12">DATA INGESTION</text>
<text class="ts" x="62" y="128" fill="#8a5a12">Run manually — not part of the deployed system</text>

